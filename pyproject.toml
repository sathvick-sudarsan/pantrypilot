[project]
name = "pantrypilot"
version = "0.1.0"
description = "Explainable pantry-based meal ranking"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "pydantic>=2,<3",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
